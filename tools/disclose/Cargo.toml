[package]
name = "imani-disclose"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Opens one Zcash shielded payment with its one-payment key, so a bid can be proven without a viewing key. A thin WebAssembly wrapper around librustzcash."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Same librustzcash pre-releases as tools/decoder (they know NU7), pinned exactly.
zcash_client_backend = { version = "=0.25.0-pre.1", default-features = false, features = ["orchard"] }
zcash_primitives = { version = "=0.31.0-pre.1", default-features = false }
zcash_keys = { version = "=0.17.0-pre.1", default-features = false, features = ["orchard", "sapling"] }
zcash_protocol = { version = "=0.11.0-pre.0", default-features = false }
orchard = { version = "=0.16.0", default-features = false }
zcash_note_encryption = "=0.5.1"
hex = "0.4"
serde_json = "1"

# WebAssembly glue
wasm-bindgen = "=0.2.126"
js-sys = "=0.3.103"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

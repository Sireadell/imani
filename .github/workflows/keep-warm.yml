name: keep-warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake the live checker
        run: |
          curl --silent --show-error --fail --max-time 30 -H "Cache-Control: no-cache" \
            "https://imani-check.vercel.app/api/check?round=mainnet-01" > /dev/null

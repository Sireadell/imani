name: ci
on:
  push:
  pull_request:
    branches: [main]
# A new push to a branch cancels the older run of that branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      matrix:
        # All three systems on main and on pull requests into main. Other branches run Linux only.
        os: ${{ (github.ref == 'refs/heads/main' || github.base_ref == 'main') && fromJSON('["ubuntu-latest","windows-latest","macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run leak-scan
      - run: npm run leak-scan:history
      - run: npm run test:all
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/second-checker/check.py

name: action-selftest
on: [push, pull_request]
jobs:
  honest:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          disclosure: examples/testnet-01/disclosure.json
          result: examples/testnet-01/result.json
          scan: "true"
          chain: examples/testnet-01/chain.json
  broken:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - id: broken
        uses: ./
        continue-on-error: true
        with:
          disclosure: examples/testnet-broken/01-hidden-losing-bid/disclosure.json
          result: examples/testnet-broken/01-hidden-losing-bid/result.json
      - name: The broken round must fail
        shell: bash
        run: |
          if [ "${{ steps.broken.outcome }}" != "failure" ]; then
            echo "expected the broken round to fail, got ${{ steps.broken.outcome }}"
            exit 1
          fi
